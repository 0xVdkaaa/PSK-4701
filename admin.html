<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex min-h-screen font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-blue-900 text-white flex-shrink-0">
        <div class="p-6">
            <h1 class="text-2xl font-bold">Admin</h1>
        </div>
        <nav class="mt-2 text-sm">
            <a href="#" class="block py-3 px-6 hover:bg-blue-800 flex items-center">
                <span class="mr-3">📊</span> Dashboard
            </a>
            <a href="#" class="block py-3 px-6 bg-blue-800 flex items-center">
                <span class="mr-3">🎓</span> Mahasiswa
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold text-gray-800">Mahasiswa</h2>
            <div class="w-8 h-8 bg-gray-300 rounded-full"></div> <!-- Dummy Profile Picture -->
        </header>

        <!-- Content Area -->
        <main class="p-6">
            <div class="bg-white shadow rounded-lg p-6">
                <!-- Table Header & Button -->
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-700">Daftar Mahasiswa</h3>
                    <!-- Tombol Trigger Modal -->
                    <button onclick="document.getElementById('modalForm').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 px-4 rounded shadow">
                        + Tambah Mahasiswa
                    </button>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-blue-800 text-white text-sm">
                                <th class="p-3 border-b">NIM</th>
                                <th class="p-3 border-b">Nama</th>
                                <th class="p-3 border-b">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm text-gray-700">
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 border-b">A11.2020.13139</td>
                                <td class="p-3 border-b">Rizqy Akbar Dinul Putra</td>
                                <td class="p-3 border-b">
                                    <button class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-xs mr-1">Edit</button>
                                    <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs">Hapus</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form (Hidden by default) -->
    <div id="modalForm" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg w-1/3 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Tambah Mahasiswa</h3>
                <button onclick="document.getElementById('modalForm').classList.add('hidden')" class="text-gray-500 hover:text-red-500 text-xl font-bold">&times;</button>
            </div>
            
            <form>
                <div class="mb-4">
                    <label class="block text-sm text-gray-700 mb-1">NIM</label>
                    <input type="text" class="w-full border border-gray-300 p-2 rounded text-sm focus:outline-none focus:border-blue-500" placeholder="Masukkan NIM">
                </div>
                <div class="mb-6">
                    <label class="block text-sm text-gray-700 mb-1">Nama</label>
                    <input type="text" class="w-full border border-gray-300 p-2 rounded text-sm focus:outline-none focus:border-blue-500" placeholder="Masukkan Nama">
                </div>
                
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="document.getElementById('modalForm').classList.add('hidden')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded text-sm">Batal</button>
                    <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm">Simpan</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
