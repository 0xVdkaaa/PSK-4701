<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <!-- Import Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">Login</h2>
        
        <form>
            <div class="mb-4">
                <label class="block text-gray-700 text-xs font-bold mb-2" for="email">Email</label>
                <input class="border border-gray-300 rounded w-full py-2 px-3 text-sm focus:outline-none focus:border-blue-500" id="email" type="email" placeholder="Masukkan email">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-xs font-bold mb-2" for="password">Password</label>
                <input class="border border-gray-300 rounded w-full py-2 px-3 text-sm focus:outline-none focus:border-blue-500" id="password" type="password" placeholder="Masukkan password">
            </div>
            
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center">
                    <input type="checkbox" class="form-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded">
                    <span class="ml-2 text-xs text-gray-700">Ingat saya</span>
                </label>
                <a class="text-xs text-blue-500 hover:text-blue-700" href="#">Lupa password?</a>
            </div>
            
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 w-full rounded focus:outline-none focus:shadow-outline" type="button">
                Login
            </button>
            
            <div class="text-center mt-4">
                <span class="text-xs text-gray-600">Belum punya akun? </span>
                <a href="#" class="text-xs text-blue-500 hover:text-blue-700">Daftar</a>
            </div>
        </form>
    </div>

</body>
</html>
